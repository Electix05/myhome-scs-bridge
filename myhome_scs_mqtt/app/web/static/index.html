<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyHome SCS Bridge</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --fg: #1c1e21; --muted: #6b7280;
  --line: #e3e6ea; --accent: #03a9f4; --danger: #d93025; --ok: #1a7f37;
  --warn: #b26a00;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#111418; --card:#1c2026; --fg:#e8eaed; --muted:#9aa0a6;
          --line:#2c3138; --accent:#4fc3f7; --danger:#f28b82; --ok:#81c995;
          --warn:#fdd663; }
}
* { box-sizing: border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body > * { position: relative; z-index: 1; }
h1 { font-size:20px; margin:0 0 4px; }
h2 { font-size:15px; margin:0; font-weight:600; }
.sub { color:var(--muted); margin-bottom:16px; }
.bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px;
  margin-bottom:12px; overflow:hidden; }
.card > header { display:flex; justify-content:space-between; align-items:center;
  padding:10px 14px; cursor:pointer; user-select:none; }
.card > header:hover { background:rgba(127,127,127,.06); }
.count { color:var(--muted); font-weight:400; font-size:13px; }
.body { padding:0 14px 12px; }
/* Lights carry five options next to address and name - on a narrow screen the
   table scrolls sideways instead of squeezing every field. */
.scroll { overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:520px; }
th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); font-weight:600; padding:6px 6px; border-bottom:1px solid var(--line); }
td { padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
input[type=text], input[type=number], select { width:100%; padding:6px 8px;
  border:1px solid var(--line); border-radius:6px; background:var(--bg);
  color:var(--fg); font:inherit; min-width:70px; }
input:focus, select:focus { outline:2px solid var(--accent); outline-offset:-1px; }
input[type=checkbox] { width:17px; height:17px; accent-color:var(--accent); }
button { padding:7px 13px; border:1px solid var(--line); border-radius:7px;
  background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
button:hover { border-color:var(--accent); }
button:disabled { opacity:.45; cursor:not-allowed; border-color:var(--line); }
button.primary { background:var(--accent); border-color:var(--accent); color:#08252e; font-weight:600; }
button.link { border:none; background:none; color:var(--danger); padding:4px 6px; }
button.small { padding:4px 9px; font-size:12px; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px;
  border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:13px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--danger); }
.dot.on { background:var(--ok); }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
.sendrow { display:flex; gap:8px; margin:10px 0 6px; }
.sendrow input { flex:1; min-width:0; }
#frames { max-height:260px; overflow:auto; }
#frames div { display:flex; justify-content:space-between; gap:8px; padding:3px 0;
  border-bottom:1px solid var(--line); }
#toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
  background:var(--fg); color:var(--bg); padding:10px 18px; border-radius:8px;
  opacity:0; transition:opacity .2s; pointer-events:none; z-index:2; }
#toast.show { opacity:1; }
.hint { color:var(--muted); font-size:12px; margin:6px 0 0; }
/* What needs a decision or a look: a list that could not be read completely,
   a clean-up that waits, a save that is not in effect yet. */
.note { border:1px solid var(--line); border-left:4px solid var(--accent);
  border-radius:8px; background:var(--card); padding:10px 14px; margin-bottom:12px; }
.note.warn { border-left-color:var(--warn); }
.note.bad { border-left-color:var(--danger); }
.note strong { display:block; margin-bottom:2px; }
.note ul { margin:6px 0 0; padding-left:18px; }
.note p { margin:6px 0 0; }
.note button { margin-top:8px; }
/* The state of the add-on at a glance: one tile per thing that can be well
   or not, the colour on the left says which. */
.top { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  flex-wrap:wrap; margin-bottom:12px; }
.top .sub { margin:0; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:8px; margin-bottom:14px; }
.tile { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line);
  border-radius:10px; padding:9px 12px; min-width:0; }
.tile.ok { border-left-color:var(--ok); }
.tile.warn { border-left-color:var(--warn); }
.tile.bad { border-left-color:var(--danger); }
.tile .label { font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); font-weight:600; }
.tile .value { font-size:17px; font-weight:600; line-height:1.3; }
.tile .value { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* Two lines at most: a long list of silenced addresses must not push the
   other tiles apart - the whole text is in the tooltip. */
.tile .more { font-size:12px; color:var(--muted); overflow:hidden; display:-webkit-box;
  -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; }
.meter { height:4px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden; }
.meter i { display:block; height:100%; background:var(--accent); transition:width .4s; }
.chip { display:none; padding:4px 10px; border-radius:999px; font-size:12px;
  border:1px solid var(--warn); color:var(--warn); }
.chip.show { display:inline-block; }
.chip.bad { border-color:var(--danger); color:var(--danger); }
.badge { display:inline-block; margin-left:6px; padding:0 6px; border-radius:999px;
  font-size:11px; border:1px solid var(--accent); color:var(--accent); white-space:nowrap; }
td.addr { white-space:nowrap; }
td.addr input { width:auto; max-width:96px; }
/* What the check found: the field in red, the reason above the table. */
input.invalid, select.invalid { border-color:var(--danger); outline:1px solid var(--danger); }
tr.invalid td { background:rgba(217,48,37,.07); }
.errors { margin:0 0 8px; padding:8px 10px 8px 28px; border:1px solid var(--danger);
  border-radius:8px; color:var(--danger); font-size:13px; }
.tools { display:flex; gap:8px; align-items:center; margin:10px 0 6px; flex-wrap:wrap; }
.tools input { flex:1; min-width:120px; }
#frames button { padding:1px 8px; font-size:11px; font-family:inherit; }
#frames .what { display:flex; gap:8px; align-items:center; white-space:nowrap; }
#frames .dim { color:var(--muted); }
.foot { color:var(--muted); font-size:12px; text-align:right; margin-top:4px; }
/* The buttons stay in reach however long the list is. */
.bar { position:sticky; top:0; z-index:3; background:var(--bg); padding:8px 0; margin:0 0 8px; }
.bar input { width:auto; flex:1; min-width:150px; max-width:320px; margin-left:auto; }
#toast { z-index:5; }
/* What the device is doing right now, and the button that switches it over. */
td.live { white-space:nowrap; color:var(--muted); font-size:13px; }
td.live button { margin-left:8px; padding:2px 8px; font-size:12px; }
td.live .on { color:var(--ok); }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.chips span { display:inline-flex; align-items:center; gap:4px; padding:2px 4px 2px 10px;
  border:1px solid var(--line); border-radius:999px; font-size:13px; }
.chips button { border:none; background:none; padding:2px 6px; color:var(--accent); font-size:12px; }
/* On a phone a table with eight columns is no table any more: every device
   becomes a small card, every field carries its own label. */
@media (max-width: 700px) {
  body { padding:10px; }
  .scroll { overflow:visible; }
  table { min-width:0; }
  thead { display:none; }
  tbody tr { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; padding:12px 0;
    border-bottom:1px solid var(--line); }
  tbody tr:last-child { border-bottom:none; }
  td { display:block; border:none; padding:0; min-width:0; }
  td::before { content:attr(data-label); display:block; font-size:11px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; }
  td.wide, td.live { grid-column:1 / -1; }
  td.addr input { max-width:none; width:100%; }
  td.addr .badge { margin:4px 0 0; }
  td.last { grid-column:1 / -1; text-align:right; }
  select { min-width:0 !important; }
  /* Four buttons and the search take three lines here - too much to pin. */
  .bar { position:static; }
  .bar input { max-width:none; margin-left:0; flex-basis:100%; }
}
</style>
</head>
<body>
<div class="top">
  <h1>MyHome SCS Bridge</h1>
  <div class="sub" id="instance"></div>
</div>

<div class="tiles" id="tiles"><div class="tile"><div class="label">Add-on</div>
  <div class="value">wird geladen …</div></div></div>

<div class="bar">
  <button class="primary save" onclick="save()">Speichern &amp; neu starten</button>
  <button class="save" onclick="save(false)">Nur speichern</button>
  <button class="scan" onclick="scan(false)">Bus scannen</button>
  <button class="scan" onclick="scan(true)">Gründlich scannen</button>
  <span class="chip" id="unsaved"></span>
  <input id="search" type="text" placeholder="Suchen: Name oder Adresse" spellcheck="false"
         autocomplete="off" oninput="applySearch()">
</div>

<div id="notes"></div>

<div id="sections"></div>

<div id="ignored"></div>

<div class="card">
  <header onclick="toggle(this)"><h2>Bus-Mitschnitt</h2><span class="count" id="framecount"></span></header>
  <div class="body">
    <p class="hint">Taster drücken oder Licht schalten – die Adresse erscheint hier. Steht
      sie noch nicht in der Geräteliste, holt „+ übernehmen“ sie dorthin.</p>
    <div class="sendrow">
      <input id="frame" type="text" class="mono" placeholder="*1*1*29##" spellcheck="false"
             autocomplete="off" onkeydown="if (event.key === 'Enter') sendFrame()">
      <button onclick="sendFrame()">Senden</button>
    </div>
    <p class="hint">Was hier eingetippt wird, geht unverändert auf den Bus. Die Antwort
      erscheint im Mitschnitt darunter.</p>
    <div class="tools">
      <input id="framefilter" type="text" placeholder="Filtern: Adresse, Frame oder Geräteart"
             spellcheck="false" autocomplete="off" oninput="showFrames(true)">
      <button class="small" id="pause" onclick="togglePause()">Anhalten</button>
      <button class="small" onclick="clearFrames()">Leeren</button>
    </div>
    <div id="frames" class="mono"></div>
  </div>
</div>

<div class="foot" id="foot"></div>

<div id="toast"></div>

<script>
let SCHEMA = {}, DATA = {}, dirty = false;
// The state of the device list this page shows.  The add-on counts on with
// every device it finds; a save from a list that is behind would write those
// devices away, so the list is brought up to date first (see syncDevices).
let REVISION;
// The address every row was loaded with, and the rows removed by hand - so
// bringing the list up to date neither doubles a row whose address was
// changed nor brings back one that was just removed.
const ORIGIN = new WeakMap();
const REMOVED = new Set();
let notesShown = '';
// Devices the add-on found on the bus that nobody has saved yet ("section|address").
let NEW = new Set();
// What the add-on's check found in this list: [{section, index, field, text}].
let PROBLEMS = [];
let checkTimer, checkRun = 0;
// The bus monitor: what the add-on last sent, whether the view stands still,
// and the number of the last frame that was cleared away.
let FRAMES = [], paused = false, clearedUpTo = 0, framesShown = '';
let tilesShown = '', wasScanning = false;
// Addresses the automatic discovery leaves alone ("section|address"), as the
// add-on holds them.  Rows removed here join them with the next save.
let IGNORED = new Set();
// The rows removed since the list was loaded - until the next save they can
// simply be put back.
const TRASH = new Map();
// What every device is doing right now, and which can be switched by hand.
let LIVE = {states: {}, testable: []};

const api = (p, o) => fetch(p, o).then(r => r.json());
// POST with a JSON body; the answer carries the HTTP status as well.
const post = (p, body) => fetch(p, {method: 'POST',
  headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)})
  .then(async r => Object.assign(await r.json(), {status: r.status}));
let toastTimer;
const toast = (t, ms = 2600) => { const e = document.getElementById('toast');
  e.textContent = t; e.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => e.classList.remove('show'), ms); };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toggle(h) {
  const b = h.nextElementSibling;
  b.style.display = b.style.display === 'none' ? '' : 'none';
}

// Every change of the list goes through here: the page asks before it leaves,
// says that something is unsaved, and has the add-on look at the list again.
function touched() {
  dirty = true;
  changed();
  checkSoon();
}

function changed() {
  const chip = document.getElementById('unsaved');
  chip.textContent = PROBLEMS.length ?
    (PROBLEMS.length === 1 ? 'Ein Fehler in der Liste' : PROBLEMS.length + ' Fehler in der Liste') :
    'Ungespeicherte Änderungen';
  chip.className = 'chip' + (PROBLEMS.length ? ' bad show' : dirty ? ' show' : '');
}

async function load() {
  SCHEMA = await api('api/schema');
  // List, revision and what is new in it come in one answer - asked for one
  // after the other, a device found in between would be in one and not the other.
  const inventory = await api('api/inventory');
  REVISION = inventory.revision;
  NEW = new Set(inventory.new);
  IGNORED = new Set(inventory.ignored || []);
  adopt(inventory.devices);
  adoptTheme();
  render();
  refresh();
  setInterval(refresh, 3000);
}

// Inside Home Assistant the page takes the colours of the theme chosen there -
// light or dark is a setting of Home Assistant, not of the operating system.
// The page is served from Home Assistant's own address (ingress), so the frame
// around it can be read.  Anywhere else nothing happens and the colours follow
// the operating system as before.
function adoptTheme() {
  try {
    if (window.parent === window) return;
    const theirs = getComputedStyle(window.parent.document.documentElement);
    const pick = (name) => theirs.getPropertyValue(name).trim();
    const map = {'--bg': '--primary-background-color', '--card': '--card-background-color',
      '--fg': '--primary-text-color', '--muted': '--secondary-text-color',
      '--line': '--divider-color', '--accent': '--primary-color', '--danger': '--error-color',
      '--ok': '--success-color', '--warn': '--warning-color'};
    // Background and text decide whether anything is readable: without both
    // of them nothing is taken over at all.
    if (!pick(map['--bg']) || !pick(map['--fg'])) return;
    for (const [ours, name] of Object.entries(map)) {
      const value = pick(name);
      if (value) document.documentElement.style.setProperty(ours, value);
    }
  } catch (e) { /* not inside Home Assistant */ }
}

const key = (section, where) => section + '|' + String(where == null ? '' : where);
const found = (n) => n === 1 ? 'Ein neu erkanntes Gerät steht jetzt in der Liste.' :
  n + ' neu erkannte Geräte stehen jetzt in der Liste.';

function adopt(data) {
  DATA = data;
  REMOVED.clear();
  TRASH.clear();
  PROBLEMS = [];            // the add-on's own list has nothing wrong with it
  for (const items of Object.values(DATA))
    for (const item of items) ORIGIN.set(item, String(item.where || ''));
}

// Take over the devices the add-on knows and this page does not; what was
// edited here stays as it is.  Returns how many rows were added.
function merge(fresh) {
  let added = 0;
  for (const [section, items] of Object.entries(fresh)) {
    const mine = DATA[section] = DATA[section] || [];
    for (const item of items) {
      const where = String(item.where || '');
      if (REMOVED.has(key(section, where))) continue;
      if (mine.some(i => ORIGIN.get(i) === where || String(i.where || '') === where)) continue;
      ORIGIN.set(item, where);
      mine.push(item);
      added++;
    }
  }
  return added;
}

// The add-on's list has moved on.  Without changes of our own we simply show
// the new one; with changes the newly found devices join them.
async function syncDevices() {
  const inventory = await api('api/inventory');
  let added = 0;
  if (dirty) added = merge(inventory.devices);
  else { adopt(inventory.devices); IGNORED = new Set(inventory.ignored || []); }
  REVISION = inventory.revision;
  NEW = new Set(inventory.new);
  // Not while somebody types and nothing was added: building the tables anew
  // takes the cursor out of the field.
  if (!dirty || added) render();
  if (added) checkSoon();
  return added;
}

// ---------------------------------------------------------------- the check
// The add-on looks at the list with the same code that will read the device
// file at its next start.  What it finds is shown at the row and the field.

function checkSoon() {
  clearTimeout(checkTimer);
  checkTimer = setTimeout(check, 400);
}

async function check() {
  clearTimeout(checkTimer);
  const run = ++checkRun;
  let r;
  try { r = await post('api/check', {devices: DATA}); } catch (e) { return PROBLEMS; }
  // An answer to an older state of the list must not overwrite a newer one.
  if (run !== checkRun || !Array.isArray(r.problems)) return PROBLEMS;
  PROBLEMS = r.problems;
  mark();
  return PROBLEMS;
}

function mark() {
  document.querySelectorAll('#sections .invalid').forEach(e => {
    e.classList.remove('invalid'); e.removeAttribute('title'); });
  document.querySelectorAll('#sections .errors').forEach(e => e.remove());
  for (const p of PROBLEMS) {
    const card = document.querySelector(`#sections .card[data-section="${CSS.escape(p.section)}"]`);
    if (!card) continue;
    const tr = card.querySelectorAll('tbody tr')[p.index];
    if (!tr) continue;
    const field = p.field && tr.querySelector(`[data-key="${CSS.escape(p.field)}"]`);
    const target = field || tr;
    target.classList.add('invalid');
    target.title = p.text;
    let list = card.querySelector('.errors');
    if (!list) {
      list = document.createElement('ul');
      list.className = 'errors';
      card.querySelector('.body').insertBefore(list, card.querySelector('.scroll'));
      card.querySelector('.body').style.display = '';   // a folded card hides nothing wrong
    }
    const li = document.createElement('li');
    li.textContent = `Zeile ${p.index + 1}: ${p.text}`;
    list.appendChild(li);
  }
  changed();
}

function render() {
  const root = document.getElementById('sections');
  root.innerHTML = '';
  for (const [section, spec] of Object.entries(SCHEMA)) {
    const items = DATA[section] || [];
    const fresh = items.filter(item => isNew(section, item)).length;
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.section = section;
    card.innerHTML = `<header onclick="toggle(this)"><h2>${esc(spec.label)}</h2>
      <span class="count">${items.length}${fresh ? ' · ' + fresh + ' neu' : ''}</span></header>
      <div class="body"></div>`;
    const body = card.querySelector('.body');
    if (spec.note) {
      const note = document.createElement('p');
      note.className = 'hint';
      note.style.margin = '0 0 8px';
      note.textContent = spec.note;
      body.appendChild(note);
    }
    const table = document.createElement('table');
    table.innerHTML = '<thead><tr><th style="width:150px">Adresse</th><th>Name</th>' +
      '<th>Zustand</th>' +
      spec.fields.map(f => `<th>${esc(f.label)}</th>`).join('') + '<th style="width:40px"></th></tr></thead>';
    const tbody = document.createElement('tbody');
    items.forEach((item, index) => tbody.appendChild(row(section, spec, item, index)));
    table.appendChild(tbody);
    const scroll = document.createElement('div');
    scroll.className = 'scroll';
    scroll.appendChild(table);
    body.appendChild(scroll);
    const add = document.createElement('button');
    add.className = 'small';
    add.style.marginTop = '10px';
    add.textContent = '+ Gerät';
    add.onclick = () => { (DATA[section] = DATA[section] || []).push({where: '', name: ''});
      touched(); render(); };
    body.appendChild(add);
    if (!items.length) body.querySelector('table').style.display = 'none';
    root.appendChild(card);
  }
  mark();
  paintLive();
  showIgnored();
  applySearch();
  // Which addresses the monitor may offer depends on what this list holds.
  showFrames();
}

// --------------------------------------------------- state, test, search
// The state of every device next to its row, brought up to date in place:
// building the tables anew every three seconds would take the cursor away.

function paintLive() {
  document.querySelectorAll('#sections td.live').forEach(td => {
    const known = td.dataset.live in LIVE.states;
    const text = known ? LIVE.states[td.dataset.live] : '';
    const label = td.querySelector('span');
    label.textContent = text || '–';
    label.className = /^(an|ausgelöst|läuft|öffnet|schließt)/.test(text) ? 'on' : '';
    label.title = known ? (text ? '' : 'Von diesem Gerät kam noch nichts über den Bus') :
      'Dieses Gerät kennt das laufende Add-on noch nicht – erst speichern und neu starten';
    td.querySelector('button').hidden = !LIVE.testable.includes(td.dataset.live);
  });
}

async function testDevice(section, where, button) {
  button.disabled = true;
  let r;
  try { r = await post('api/test', {section, where}); }
  catch (e) { toast('Keine Verbindung zum Add-on.'); button.disabled = false; return; }
  button.disabled = false;
  if (!r.ok) { toast(r.error || 'Nicht geschaltet.'); return; }
  // The lamp answers over the bus; its new state is there a moment later.
  setTimeout(async () => { try { LIVE = await api('api/live'); paintLive(); } catch (e) {} }, 700);
}

function applySearch() {
  const wanted = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('#sections .card').forEach(card => {
    const items = DATA[card.dataset.section] || [];
    let hits = 0;
    card.querySelectorAll('tbody tr').forEach((tr, index) => {
      const item = items[index] || {};
      const hit = !wanted || String(item.where || '').toLowerCase().includes(wanted) ||
        String(item.name || '').toLowerCase().includes(wanted);
      tr.style.display = hit ? '' : 'none';
      if (hit) hits++;
    });
    // While searching, a section without a hit only is in the way.
    card.style.display = wanted && !hits ? 'none' : '';
  });
}

// ------------------------------------------------------ ignored addresses
// A device removed from the list would be created again the next time it
// speaks on the bus.  So removing a row also tells the add-on to leave that
// address alone - and this card is where that can be taken back.

function ignoredNow() {
  const keys = new Set([...IGNORED, ...REMOVED]);
  for (const [section, items] of Object.entries(DATA))
    for (const item of items) keys.delete(key(section, item.where));
  return [...keys].sort();
}

function showIgnored() {
  const root = document.getElementById('ignored');
  root.innerHTML = '';
  const keys = ignoredNow();
  if (!keys.length) return;
  const card = document.createElement('div');
  card.className = 'card';
  const head = document.createElement('header');
  head.onclick = () => toggle(head);
  const title = document.createElement('h2');
  title.textContent = 'Ausgeblendete Adressen';
  const count = document.createElement('span');
  count.className = 'count'; count.textContent = keys.length;
  head.appendChild(title); head.appendChild(count);
  const body = document.createElement('div');
  body.className = 'body';
  const hint = document.createElement('p');
  hint.className = 'hint'; hint.style.margin = '0';
  hint.textContent = 'Aus der Liste entfernt: Meldet sich eine dieser Adressen am Bus, legt ' +
    'das Add-on sie nicht wieder an. „wieder zulassen“ nimmt das zurück – wirksam mit dem ' +
    'nächsten Speichern.';
  const chips = document.createElement('div');
  chips.className = 'chips';
  for (const k of keys) {
    const [section, where] = [k.slice(0, k.indexOf('|')), k.slice(k.indexOf('|') + 1)];
    const chip = document.createElement('span');
    chip.textContent = (SCHEMA[section] ? SCHEMA[section].label : section) + ' ' + where;
    const back = document.createElement('button');
    // Removed a moment ago and not saved yet: the row itself can come back.
    back.textContent = TRASH.has(k) ? 'zurückholen' : 'wieder zulassen';
    back.onclick = () => {
      IGNORED.delete(k); REMOVED.delete(k);
      if (TRASH.has(k)) { (DATA[section] = DATA[section] || []).push(TRASH.get(k)); TRASH.delete(k); }
      touched(); render(); };
    chip.appendChild(back);
    chips.appendChild(chip);
  }
  body.appendChild(hint); body.appendChild(chips);
  card.appendChild(head); card.appendChild(body);
  root.appendChild(card);
}

// Found on the bus and not saved by anybody yet - and still the row it was.
const isNew = (section, item) => ORIGIN.get(item) !== undefined &&
  NEW.has(key(section, ORIGIN.get(item)));

function row(section, spec, item, index) {
  const tr = document.createElement('tr');
  const set = (key, value) => {
    if (value === '' || value === null) delete item[key]; else item[key] = value;
    touched(); };

  const where = document.createElement('input');
  where.type = 'text'; where.className = 'mono'; where.value = item.where || '';
  where.dataset.key = 'where';
  where.placeholder = '12'; where.oninput = () => set('where', where.value.trim());
  const name = document.createElement('input');
  name.type = 'text'; name.value = item.name || '';
  name.dataset.key = 'name';
  name.placeholder = 'Name'; name.oninput = () => set('name', name.value);
  const address = cell(where, 'Adresse');
  address.className = 'addr';
  if (isNew(section, item)) {
    const badge = document.createElement('span');
    badge.className = 'badge'; badge.textContent = 'neu';
    badge.title = 'Am Bus gefunden, noch nicht in der Gerätedatei gespeichert';
    address.appendChild(badge);
  }
  tr.appendChild(address); tr.appendChild(cell(name, 'Name'));

  // What the device is doing, and - for lamps and actuators - a button that
  // switches it over: the quickest way to find out which address is which lamp.
  const state = document.createElement('span');
  const live = cell(state, 'Zustand');
  live.className = 'live';
  live.dataset.live = key(section, ORIGIN.get(item));
  const test = document.createElement('button');
  test.textContent = 'Schalten'; test.hidden = true;
  test.title = 'Schaltet dieses Gerät um – so zeigt sich, welche Lampe an dieser Adresse hängt';
  test.onclick = () => testDevice(section, ORIGIN.get(item), test);
  live.appendChild(test);
  tr.appendChild(live);

  for (const f of spec.fields) {
    let el;
    if (f.type === 'bool') {
      el = document.createElement('input'); el.type = 'checkbox';
      el.checked = !!item[f.key];
      el.onchange = () => { item[f.key] = el.checked; touched(); };
    } else if (f.type === 'select') {
      el = document.createElement('select');
      if (f.wide) el.style.minWidth = '230px';
      const options = f.options.map(o => (typeof o === 'string' ? {value: o, label: o} : o));
      const current = item[f.key];
      // An entry that is no longer offered must not disappear silently.
      if (current && !options.some(o => o.value === current))
        options.unshift({value: current, label: current + ' (unbekannt)'});
      el.innerHTML = '<option value="">— keine —</option>' +
        options.map(o => `<option value="${esc(o.value)}"` +
          `${current === o.value ? ' selected' : ''}>${esc(o.label)}</option>`).join('');
      el.onchange = () => set(f.key, el.value);
    } else if (f.type === 'list') {
      el = document.createElement('input'); el.type = 'text';
      el.placeholder = f.placeholder || '';
      el.value = Array.isArray(item[f.key]) ? item[f.key].join(', ') : (item[f.key] || '');
      el.oninput = () => {
        const v = el.value.split(',').map(s => s.trim()).filter(Boolean)
          .map(s => isNaN(s) ? s : Number(s));
        if (v.length) item[f.key] = v; else delete item[f.key];
        touched(); };
    } else {
      el = document.createElement('input');
      el.type = f.type === 'number' ? 'number' : 'text';
      el.step = 'any'; el.placeholder = f.placeholder || '';
      el.value = item[f.key] == null ? '' : item[f.key];
      el.oninput = () => set(f.key, el.value === '' ? '' :
        (f.type === 'number' ? Number(el.value) : el.value));
    }
    el.dataset.key = f.key;
    const td = cell(el, f.label);
    if (f.type === 'select' || f.type === 'list') td.className = 'wide';
    tr.appendChild(td);
  }

  const del = document.createElement('button');
  del.className = 'link'; del.textContent = '✕';
  del.title = 'Entfernen – die Adresse wird danach nicht mehr von selbst angelegt';
  del.onclick = () => { DATA[section].splice(index, 1);
    if (ORIGIN.get(item)) { REMOVED.add(key(section, ORIGIN.get(item)));
      TRASH.set(key(section, ORIGIN.get(item)), item); }
    // The rows below move up by one - what was found has to move with them.
    PROBLEMS = PROBLEMS.filter(p => !(p.section === section && p.index === index))
      .map(p => p.section === section && p.index > index ? {...p, index: p.index - 1} : p);
    touched(); render(); };
  const last = cell(del);
  last.className = 'last';
  tr.appendChild(last);
  return tr;
}

// The label is what the phone layout shows above the field (see the style sheet).
function cell(el, label) {
  const td = document.createElement('td');
  if (label) td.dataset.label = label;
  td.appendChild(el);
  return td;
}

function refuseWithProblems() {
  toast((PROBLEMS.length === 1 ? 'Ein Fehler' : PROBLEMS.length + ' Fehler') +
    ' in der Geräteliste – nichts gespeichert. Die Stellen sind rot markiert.', 7000);
  const first = document.querySelector('#sections .invalid');
  if (first) first.scrollIntoView({block: 'center', behavior: 'smooth'});
}

async function save(restart = true) {
  // Look first, with the list exactly as it stands - not with what the last
  // look half a second ago saw.
  if ((await check()).length) { refuseWithProblems(); return; }
  const clean = {};
  for (const [section, items] of Object.entries(DATA)) {
    const kept = (items || []).filter(i => String(i.where || '').trim() !== '');
    if (kept.length) clean[section] = kept;
  }
  // The rows removed here go along as addresses to leave alone from now on.
  const ignored = ignoredNow();
  let r;
  try {
    r = await post('api/devices', {revision: REVISION, devices: clean, ignored});
  } catch (e) { toast('Keine Verbindung zum Add-on – nichts gespeichert.'); return; }
  if (r.status === 409) {
    // The add-on found devices this page did not show yet.  Saved as it is,
    // the list would have dropped them - so they join it first.
    let added = 0;
    try { added = await syncDevices(); }
    catch (e) { toast('Keine Verbindung zum Add-on – nichts gespeichert.'); return; }
    toast((added ? found(added) : 'Die Geräteliste hat sich inzwischen geändert.') +
      ' Nichts gespeichert – bitte prüfen und noch einmal speichern.', 9000);
    return;
  }
  if (r.status === 422) {
    // The add-on itself refused the list - show where, row by row.
    await check();
    refuseWithProblems();
    return;
  }
  // Only a confirmed save may restart the add-on.
  if (!r.ok) { toast(r.error || 'Speichern fehlgeschlagen.'); return; }
  dirty = false;
  REMOVED.clear();
  TRASH.clear();
  IGNORED = new Set(ignored);
  changed();
  showIgnored();
  if (restart) { toast('Gespeichert – Add-on startet neu …'); await restartAddon(); }
  else toast('Gespeichert. Wirksam nach einem Neustart.');
}

async function restartAddon() {
  await api('api/restart', {method: 'POST'}).catch(() => {});
}

async function scan(deep) {
  try {
    await api('api/scan', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({deep: deep})});
  } catch (e) { toast('Keine Verbindung zum Add-on.'); return; }
  toast(deep ? 'Gründlicher Scan gestartet …' : 'Scan gestartet …');
  setTimeout(refresh, 300);
}

// ---------------------------------------------------------------- the tiles
// One tile per thing that can be well or not.  Built anew only when a value
// changed, so a tooltip that is open does not flicker away every three seconds.

function tiles(s) {
  const silenced = s.silenced || [];
  const scan = String(s.scan || '');
  const cut = scan.indexOf(':');
  const progress = s.scan_progress && s.scan_progress.total ?
    Math.min(100, Math.round(100 * s.scan_progress.done / s.scan_progress.total)) : null;
  const list = [
    {label: 'Gateway', value: s.connected ? 'verbunden' : 'getrennt', more: s.host,
     kind: s.connected ? 'ok' : 'bad'},
    {label: 'MQTT', value: s.mqtt_connected ? 'verbunden' : 'getrennt',
     more: `${s.mqtt_broker} · ${s.subscriptions} Abos`, kind: s.mqtt_connected ? 'ok' : 'bad'},
    {label: 'Geräte', value: s.devices,
     more: silenced.length ? silenced.length + ' stillgelegt: ' + silenced.join(', ') :
       'alle werden abgefragt', kind: silenced.length ? 'warn' : ''},
    {label: 'Bus', value: s.sent_per_minute + '/min',
     more: 'gesendet · ' + s.received_per_minute + '/min empfangen', kind: ''},
    {label: 'Warteschlange', value: s.queue,
     more: s.dropped ? s.dropped + ' Abfragen verworfen' : 'wartende Frames',
     kind: s.dropped || s.queue > 50 ? 'warn' : ''},
    {label: 'Bremse', value: s.brake_gap > 0 ? s.brake_gap + ' s Abstand' : 'aus',
     more: `${s.refused} abgelehnt · ${s.unanswered} ohne Antwort`,
     kind: s.brake_gap > 0 ? 'warn' : ''},
    {label: 'Bus-Scan', value: progress !== null ? progress + ' %' :
       (cut > 0 ? scan.slice(0, cut) : scan),
     more: s.scanning ? scan + ' – Schalten kann dauern' :
       (cut > 0 ? scan.slice(cut + 1).trim() : 'auf Knopfdruck'),
     kind: scan.startsWith('abgebrochen') || scan.startsWith('kein') ? 'warn' : '', progress},
  ];
  const shown = JSON.stringify(list);
  if (shown === tilesShown) return;
  tilesShown = shown;
  const root = document.getElementById('tiles');
  root.innerHTML = '';
  for (const t of list) {
    const tile = document.createElement('div');
    tile.className = 'tile ' + t.kind;
    for (const [cls, text] of [['label', t.label], ['value', t.value], ['more', t.more]]) {
      const e = document.createElement('div');
      e.className = cls; e.textContent = text == null ? '' : text;
      if (cls === 'more') e.title = e.textContent;
      tile.appendChild(e);
    }
    if (t.progress !== null && t.progress !== undefined) {
      const meter = document.createElement('div');
      meter.className = 'meter';
      const bar = document.createElement('i');
      bar.style.width = t.progress + '%';
      meter.appendChild(bar);
      tile.appendChild(meter);
    }
    root.appendChild(tile);
  }
}

async function refresh() {
  try {
    const s = await api('api/status');
    tiles(s);
    document.getElementById('instance').textContent = s.instance ? 'Instanz ' + s.instance : '';
    document.getElementById('foot').textContent = s.version ? 'Version ' + s.version : '';
    notes(s);
    // Entries the add-on could not read are not in this list - saving it
    // would write the device file without them.
    document.querySelectorAll('button.save').forEach(b => { b.disabled = !!s.saving_blocked; });
    // One scan at a time; the add-on would only say "already running".
    document.querySelectorAll('button.scan').forEach(b => { b.disabled = !!s.scanning; });
    if (wasScanning && !s.scanning) toast('Bus-Scan ' + s.scan, 6000);
    wasScanning = !!s.scanning;
    if (s.revision !== REVISION) {
      const added = await syncDevices();
      if (added) toast(found(added), 6000);
    }
    LIVE = await api('api/live');
    paintLive();
    FRAMES = (await api('api/frames')).frames;
    showFrames();
    adoptTheme();
  } catch (e) { /* Ingress blinzelt beim Neustart */ }
}

// ---------------------------------------------------------- the bus monitor
// Newest on top.  The list stands still while it is paused, scrolled down or
// has text selected in it - otherwise the line somebody is reading or copying
// would jump away every three seconds.

function showFrames(force = false) {
  const box = document.getElementById('frames');
  const filter = document.getElementById('framefilter').value.trim().toLowerCase();
  const visible = FRAMES.filter(x => (x.id || 0) > clearedUpTo);
  document.getElementById('framecount').textContent = visible.length;
  const selection = window.getSelection();
  const reading = paused || box.scrollTop > 4 ||
    (selection && !selection.isCollapsed && box.contains(selection.anchorNode));
  if (reading && !force) return;
  const lines = visible.filter(x => !filter ||
    (x.frame + ' ' + frameLabel(x)).toLowerCase().includes(filter)).reverse();
  const shown = JSON.stringify([lines.map(x => [x.id, x.count]), filter,
    lines.map(x => canTakeOver(x))]);
  if (shown === framesShown) return;
  framesShown = shown;
  box.innerHTML = '';
  for (const x of lines) {
    const line = document.createElement('div');
    const left = document.createElement('span');
    left.textContent = `${x.time || ''} ${x.frame}`;
    if (x.count > 1) {
      const times = document.createElement('span');
      times.className = 'dim'; times.textContent = ' ×' + x.count;
      left.appendChild(times);
    }
    const right = document.createElement('span');
    right.className = 'what';
    const label = document.createElement('span');
    label.textContent = frameLabel(x);
    right.appendChild(label);
    if (canTakeOver(x)) {
      const button = document.createElement('button');
      button.textContent = '+ übernehmen';
      button.title = 'Diese Adresse in die Geräteliste aufnehmen';
      button.onclick = () => takeOver(x);
      right.appendChild(button);
    }
    line.appendChild(left); line.appendChild(right);
    box.appendChild(line);
  }
}

// "Licht und Dimmer 33" reads better than "lights 33".
const frameLabel = (x) => x.section && SCHEMA[x.section] ?
  SCHEMA[x.section].label + ' ' + x.where : (x.hint || '');

// An address the bus talks about and this list does not know.
const canTakeOver = (x) => !!(x.section && x.where && SCHEMA[x.section] &&
  !(DATA[x.section] || []).some(i => String(i.where || '') === x.where));

function takeOver(x) {
  const items = DATA[x.section] = DATA[x.section] || [];
  items.push({where: x.where, name: ''});
  touched();
  render();
  showFrames(true);
  const card = document.querySelector(`#sections .card[data-section="${CSS.escape(x.section)}"]`);
  card.querySelector('.body').style.display = '';
  const rows = card.querySelectorAll('tbody tr');
  const name = rows[rows.length - 1].querySelector('[data-key="name"]');
  name.scrollIntoView({block: 'center', behavior: 'smooth'});
  name.focus({preventScroll: true});
  toast(`${SCHEMA[x.section].label} ${x.where} steht jetzt in der Liste – Namen eintragen und speichern.`, 5000);
}

function togglePause() {
  paused = !paused;
  document.getElementById('pause').textContent = paused ? 'Weiter' : 'Anhalten';
  if (!paused) showFrames(true);
}

function clearFrames() {
  clearedUpTo = FRAMES.reduce((highest, x) => Math.max(highest, x.id || 0), clearedUpTo);
  showFrames(true);
}

// The notes above the device list.  Built anew only when something changed -
// otherwise the button that waits for its second click would lose its place
// every three seconds.
function notes(s) {
  const shown = JSON.stringify([s.problems, s.saving_blocked, s.purge_held, s.restart_pending]);
  if (shown === notesShown) return;
  notesShown = shown;
  const root = document.getElementById('notes');
  root.innerHTML = '';
  const note = (kind, title) => { const e = document.createElement('div');
    e.className = 'note ' + kind;
    const head = document.createElement('strong'); head.textContent = title;
    e.appendChild(head); root.appendChild(e); return e; };
  const line = (parent, tag, text) => { const e = document.createElement(tag);
    e.textContent = text; parent.appendChild(e); return e; };

  if (s.problems && s.problems.length) {
    const e = note('bad', 'Die Geräteliste konnte nicht vollständig gelesen werden.');
    const list = document.createElement('ul');
    s.problems.forEach(text => line(list, 'li', text));
    e.appendChild(list);
    line(e, 'p', 'Solange das so ist, entfernt das Add-on nichts aus Home Assistant – ' +
      'auch keine Geräte, die wirklich gelöscht wurden.' + (s.saving_blocked ?
      ' Speichern ist gesperrt: Diese Liste kennt die nicht gelesenen Einträge nicht und ' +
      'würde sie aus der Gerätedatei löschen. Die Datei von Hand korrigieren, dann neu starten.' :
      ' Speichern schreibt alle Geräte dieser Liste in die Gerätedatei und leert das ' +
      'Gedächtnis – danach ist die Liste wieder vollständig.'));
  }
  if (s.purge_held) {
    const held = s.purge_held;
    const e = note('warn', held.devices + ' Geräte (' + held.entities + ' Entities in Home ' +
      'Assistant) stehen nicht mehr in der Geräteliste.');
    line(e, 'p', 'So viele auf einmal sehen nach einem Versehen aus, deshalb ist noch ' +
      'nichts entfernt. Stimmt der Pfad der Gerätedatei? Wurde das Add-on ohne seine ' +
      'Daten umgezogen? Mit dem Entfernen vergisst Home Assistant Name, Raum und ' +
      'Verlauf dieser Geräte.');
    line(e, 'p', held.examples.join(', ') +
      (held.devices > held.examples.length ? ' …' : '')).className = 'mono';
    const button = line(e, 'button', 'Aus Home Assistant entfernen');
    button.onclick = () => purge(button);
  }
  if (s.restart_pending) {
    const e = note('', 'Gespeichert, aber noch nicht wirksam.');
    line(e, 'p', 'Die gespeicherte Geräteliste gilt ab dem nächsten Start des Add-ons.');
    line(e, 'button', 'Jetzt neu starten').onclick = () => {
      toast('Add-on startet neu …'); restartAddon(); };
  }
}

// Two clicks: the first one only asks.
async function purge(button) {
  if (!button.dataset.armed) {
    button.dataset.armed = '1';
    button.textContent = 'Wirklich entfernen? Noch einmal klicken';
    setTimeout(() => { delete button.dataset.armed;
      button.textContent = 'Aus Home Assistant entfernen'; }, 6000);
    return;
  }
  button.disabled = true;
  let r;
  try { r = await post('api/purge', {}); }
  catch (e) { toast('Keine Verbindung zum Add-on – nichts entfernt.'); button.disabled = false; return; }
  if (!r.ok) { toast(r.error || 'Nichts entfernt.'); button.disabled = false; return; }
  toast('Entfernt.');
  refresh();
}

async function sendFrame() {
  const box = document.getElementById('frame');
  const frame = box.value.trim();
  if (!frame) return;
  let r;
  try {
    r = await api('api/send', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({frame})});
  } catch (e) { toast('Keine Verbindung zum Add-on.'); return; }
  if (r.error) { toast(r.error); return; }
  box.value = '';
  toast('Gesendet: ' + frame);
  setTimeout(refresh, 600);
}

window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
load();
</script>
</body>
